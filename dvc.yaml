stages:
  prepare:
    cmd: python prepare.py
    deps:
      - prepare.py
    outs:
      - data/raw

  preprocess:
    cmd: python preprocess.py
    deps:
      - preprocess.py
      - data/raw
      - params.yaml
    params:
      - preprocess
    outs:
      - data/processed

  train:
    cmd: python train.py
    deps:
      - train.py
      - data/processed
      - params.yaml
    params:
      - train
    outs:
      - models/model.h5   

  evaluate:
    cmd: python evaluate.py
    deps:
      - evaluate.py
      - models/model.pkl
      - data/processed
      - params.yaml
    params:
      - evaluate
    metrics:
      - metrics/metrics.json:
          cache: false
    plots:
      - metrics/confusion_matrix.png:
          cache: false