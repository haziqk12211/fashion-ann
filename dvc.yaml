stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - src/prepare.py
    outs:
    - data/raw

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw
      - params.yaml
    params:
      - preprocess
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
    - src/train.py
    - data/processed
    - params.yaml
    params:
    - train
    outs:
    - models/model.h5

  evaluate:
    cmd: python src/evaluate.py
    deps:
    - src/evaluate.py
    - models/model.h5
    - data/processed
    - params.yaml
    params:
    - evaluate
    metrics:
    - metrics/metrics.json:
        cache: false
    plots:
    - metrics/confusion_matrix.png:
        cache: false
